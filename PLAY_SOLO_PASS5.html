<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06070b" />
<title>SOLO: UNICORN RUN — Merged Build</title>
<style>:root {
  --bg: #06070b;
  --panel: rgba(12, 15, 24, 0.94);
  --panel-2: rgba(19, 24, 36, 0.96);
  --line: #2d374d;
  --text: #f3f7ff;
  --muted: #9ca9bd;
  --cyan: #13dff5;
  --blue: #4d84ff;
  --purple: #9c5bff;
  --pink: #ff4fb7;
  --green: #67e77b;
  --amber: #ffd34e;
  --red: #ff5d67;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
  --pixel: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--pixel); }
body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
button, input, select { font: inherit; }
button { color: inherit; }

#app { min-height: 100vh; min-height: 100dvh; }

.scanlines::after {
  content: "";
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  opacity: 0.12;
  background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255,255,255,0.08) 4px);
  mix-blend-mode: overlay;
}

.logo {
  display: inline-flex;
  flex-direction: column;
  font-weight: 1000;
  letter-spacing: -0.08em;
  line-height: 0.84;
  text-shadow: 0 3px 0 #000;
}
.logo strong { font-size: clamp(2.3rem, 8vw, 5.2rem); }
.logo em { color: var(--cyan); font-style: italic; font-size: clamp(1rem, 3.2vw, 2.2rem); letter-spacing: 0.04em; }
.logo .rainbow { letter-spacing: -0.3em; margin-left: .25em; }

.title-screen {
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  display: grid;
  place-items: center;
  background:
    linear-gradient(90deg, rgba(4,6,10,.98), rgba(4,6,10,.62) 47%, rgba(4,6,10,.18)),
    linear-gradient(0deg, rgba(4,6,10,.9), transparent 54%),
    none center/cover;
}

.title-card {
  width: min(760px, 100%);
  justify-self: start;
  padding: clamp(20px, 5vw, 44px);
  border: 2px solid rgba(94, 210, 255, .48);
  border-radius: 8px;
  background: linear-gradient(145deg, rgba(8,11,18,.96), rgba(17,10,28,.88));
  box-shadow: 0 0 0 4px #050609, 0 0 36px rgba(19,223,245,.14), var(--shadow);
}

.kicker { color: var(--amber); font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.lead { max-width: 60ch; color: #dbe5f6; line-height: 1.65; font-size: clamp(.92rem, 2.3vw, 1.08rem); }
.tagline { color: var(--cyan); font-weight: 900; }

.button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.btn {
  appearance: none;
  border: 2px solid #3b4760;
  border-radius: 4px;
  background: linear-gradient(#1e2636, #101521);
  color: var(--text);
  padding: 13px 18px;
  font-weight: 900;
  letter-spacing: .02em;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.45), 0 5px 0 #05070b;
  cursor: pointer;
  transition: transform .1s ease, filter .15s ease, border-color .15s ease;
}
.btn:hover { filter: brightness(1.13); border-color: var(--cyan); }
.btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px rgba(0,0,0,.45), 0 2px 0 #05070b; }
.btn.primary { background: linear-gradient(#0ea8be, #08667a); border-color: #51efff; }
.btn.purple { background: linear-gradient(#8150e8, #46277f); border-color: #b58aff; }
.btn.green { background: linear-gradient(#3dad58, #1f6d37); border-color: #82f394; }
.btn.amber { background: linear-gradient(#dba52d, #8a5b0d); border-color: #ffe079; color: #151009; }
.btn.danger { background: linear-gradient(#b43d4c, #6c1c29); border-color: #ff8790; }
.btn.ghost { background: rgba(11,14,21,.72); }
.btn.small { padding: 8px 11px; font-size: .78rem; box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.7); }

.setup-screen {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(circle at 50% 15%, rgba(60,31,103,.55), transparent 36%), #070910;
}
.setup-panel { width: min(980px, 100%); }
.setup-panel h1 { margin-bottom: 6px; }
.field { display: grid; gap: 8px; margin: 18px 0; }
.field label { color: var(--cyan); font-weight: 900; }
.field input {
  width: 100%;
  padding: 14px;
  color: #fff;
  background: #0d111b;
  border: 2px solid #303a4f;
  border-radius: 4px;
  outline: none;
}
.field input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(19,223,245,.12); }

.doctrine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.doctrine-card {
  text-align: left;
  min-height: 190px;
  padding: 18px;
  background: linear-gradient(160deg, #161b28, #0c1019);
  border: 2px solid #30394c;
  border-radius: 6px;
  cursor: pointer;
  color: inherit;
}
.doctrine-card:hover, .doctrine-card.selected { border-color: var(--purple); box-shadow: 0 0 24px rgba(156,91,255,.18); }
.doctrine-card h3 { margin: 0 0 9px; color: #fff; }
.doctrine-card p { color: var(--muted); line-height: 1.5; font-size: .88rem; }
.doctrine-card .perk { color: var(--green); font-weight: 800; }
.doctrine-card .risk { color: var(--amber); font-weight: 800; }

.game-shell {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: #07080d;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: 1.1fr repeat(5, minmax(110px, 1fr)) auto;
  gap: 2px;
  padding: 2px;
  background: #050609;
  border-bottom: 2px solid #30384a;
}
.brand-mini { display: flex; align-items: center; padding: 9px 14px; background: #0b0e15; }
.brand-mini b { font-size: 1.15rem; }
.brand-mini span { color: var(--cyan); font-size: .72rem; margin-left: 7px; }
.stat-card { min-width: 0; padding: 8px 10px; background: #0c0f16; border-left: 1px solid #242b3b; }
.stat-card .label { color: #aab5c8; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; }
.stat-card .value { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; font-weight: 1000; font-size: 1.15rem; white-space: nowrap; }
.stat-card .delta { color: var(--green); font-size: .66rem; }
.stat-card.runway .value { color: var(--green); }
.stat-card.revenue .value { color: #b8ff84; }
.stat-card.momentum .value { color: var(--purple); }
.stat-card.trust .value { color: #66a6ff; }
.stat-card.energy .value { color: var(--amber); }
.level-chip { display: grid; align-content: center; min-width: 88px; padding: 8px 12px; background: #11141e; text-align: center; }
.level-chip strong { color: var(--pink); }
.level-chip small { color: var(--muted); }

.main-layout {
  min-width: 0;
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr) 300px;
  gap: 8px;
  padding: 8px;
}
.side-panel, .center-panel {
  min-width: 0;
  border: 2px solid #2d3548;
  border-radius: 5px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.side-panel { padding: 12px; }
.panel-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; color: var(--cyan); font-size: .9rem; text-transform: uppercase; letter-spacing: .07em; }
.panel-title small { color: var(--muted); }

.agent-stack { display: grid; gap: 9px; }
.agent-card {
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: 10px;
  padding: 10px;
  border: 1px solid #34405a;
  background: #10141f;
  border-radius: 4px;
  cursor: pointer;
}
.agent-card:hover { border-color: var(--cyan); }
.avatar {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 3px;
  font-size: 1.05rem;
  font-weight: 1000;
  color: #0a0b0f;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.18);
}
.agent-card h3 { margin: 0; color: var(--cyan); font-size: .9rem; }
.agent-meta { color: var(--muted); font-size: .68rem; line-height: 1.45; }
.mini-meter { height: 7px; margin-top: 8px; border: 1px solid #3b455a; background: #080a0f; }
.mini-meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.status-line { display: flex; justify-content: space-between; margin-top: 5px; font-size: .65rem; color: var(--green); }

.founder-log { margin-top: 12px; padding: 10px; border: 1px solid #264d3a; background: #07120d; color: #87f2a0; font-size: .72rem; line-height: 1.55; }

.center-panel { position: relative; overflow: hidden; min-height: 580px; }
.scene {
  position: absolute;
  inset: 0;
  isolation: isolate;
  background: none center/cover no-repeat;
}
.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(2,3,6,.75), transparent 35%), radial-gradient(circle at 50% 52%, transparent 30%, rgba(2,3,6,.36));
  pointer-events: none;
}
.scene-header { position: relative; z-index: 3; text-align: center; padding: 18px 12px; text-shadow: 0 3px 0 #000, 0 0 18px #000; }
.scene-header h1 { margin: 0; font-size: clamp(1.55rem, 4vw, 3rem); letter-spacing: -.06em; }
.scene-header p { margin: 5px 0 0; color: var(--amber); font-weight: 900; }

.scene-badges { position: absolute; z-index: 4; left: 14px; right: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.scene-badge { padding: 7px 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(5,7,12,.82); font-size: .68rem; border-radius: 3px; }
.scene-badge strong { color: var(--cyan); }

.hotspot {
  position: absolute;
  z-index: 4;
  width: 34px;
  height: 34px;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  background: rgba(19,223,245,.18);
  box-shadow: 0 0 0 7px rgba(19,223,245,.09), 0 0 24px rgba(19,223,245,.7);
  animation: pulse 1.7s infinite;
  cursor: pointer;
}
.hotspot::before { content: "+"; display: grid; place-items: center; height: 100%; font-weight: 1000; }
.hotspot.memory { left: 48%; top: 25%; }
.hotspot.product { right: 14%; top: 31%; border-color: var(--purple); box-shadow: 0 0 0 7px rgba(156,91,255,.09), 0 0 24px rgba(156,91,255,.7); }
.hotspot.agents { right: 30%; bottom: 25%; }
@keyframes pulse { 50% { transform: scale(1.12); filter: brightness(1.35); } }

.task-list { display: grid; gap: 9px; }
.task-card { padding: 11px; background: #10141f; border: 1px solid #34405a; border-left: 4px solid var(--amber); border-radius: 4px; }
.task-card.role-research { border-left-color: var(--blue); }
.task-card.role-engineering { border-left-color: var(--purple); }
.task-card.role-marketing { border-left-color: var(--green); }
.task-card.role-general { border-left-color: var(--amber); }
.task-card h3 { margin: 0 0 5px; font-size: .85rem; }
.task-card p { margin: 0 0 9px; color: var(--muted); font-size: .7rem; line-height: 1.4; }
.task-controls { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.task-controls select { min-width: 0; padding: 8px; color: #fff; background: #080b11; border: 1px solid #3e4961; border-radius: 3px; }
.review-toggle { margin-top: 7px; width: 100%; padding: 7px; border: 1px dashed #52607b; background: #0a0d14; cursor: pointer; color: #b8c3d7; }
.review-toggle.active { color: #171208; background: var(--amber); border-style: solid; }
.reward { margin-top: 7px; color: var(--green); font-size: .67rem; }
.sprint-goal { margin-top: 12px; padding: 11px; border: 1px solid #42506b; background: #0b0e16; }
.sprint-goal strong { color: var(--amber); }
.progress { height: 10px; margin-top: 8px; background: #05070b; border: 1px solid #3c465d; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .35s ease; }
.attention { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; margin-bottom: 9px; background: #16120a; border: 1px solid #57451b; color: var(--amber); font-size: .75rem; }

.bottom-nav {
  position: sticky;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(6, 1fr) auto;
  gap: 2px;
  padding: 2px max(2px, env(safe-area-inset-right)) max(2px, env(safe-area-inset-bottom)) max(2px, env(safe-area-inset-left));
  background: #050609;
  border-top: 2px solid #30384a;
}
.nav-btn { position: relative; padding: 11px 8px; border: 1px solid #262e3e; background: #0c0f16; color: #aeb8c9; cursor: pointer; font-size: .72rem; font-weight: 900; }
.nav-btn:hover, .nav-btn.active { color: #fff; border-color: var(--cyan); background: #101a24; box-shadow: inset 0 0 12px rgba(19,223,245,.14); }
.nav-btn .icon { display: block; font-size: 1rem; margin-bottom: 3px; }
.nav-btn .badge { position: absolute; top: 4px; right: 8px; min-width: 19px; padding: 2px 5px; border-radius: 9px; color: white; background: var(--red); font-size: .62rem; }
.coin-chip { display: grid; place-items: center; min-width: 86px; padding: 8px; background: #171207; border: 1px solid #5c4713; color: var(--amber); font-weight: 900; }

.overlay-screen { min-height: 580px; padding: 18px; overflow: auto; background: linear-gradient(145deg, #0d111a, #090b11); }
.screen-heading { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.screen-heading h2 { margin: 0; color: var(--cyan); }
.screen-heading p { margin: 4px 0 0; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.info-card { padding: 15px; background: #111621; border: 1px solid #34405a; border-radius: 5px; }
.info-card h3 { margin: 0 0 8px; }
.info-card p { color: var(--muted); line-height: 1.55; font-size: .82rem; }
.info-card .big { color: var(--amber); font-size: 1.6rem; font-weight: 1000; }
.info-card.locked { opacity: .55; }
.upgrade-card.purchased { border-color: var(--green); box-shadow: inset 0 0 18px rgba(103,231,123,.08); }
.precedent-card { border-left: 4px solid var(--purple); }
.precedent-card .context { display: grid; grid-template-columns: repeat(2,1fr); gap: 6px; color: #bdc8dc; font-size: .68rem; }
.timeline { display: grid; gap: 10px; }
.timeline-item { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: start; }
.timeline-item .time { color: var(--amber); font-weight: 900; font-size: .72rem; }
.timeline-item .event { padding: 11px; background: #111621; border-left: 3px solid var(--cyan); }

.modal-backdrop { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 18px; background: rgba(1,2,5,.82); backdrop-filter: blur(5px); }
.modal { width: min(760px, 100%); max-height: 92vh; overflow: auto; padding: 20px; background: linear-gradient(145deg, #151a27, #090c13); border: 2px solid #4a5874; border-radius: 6px; box-shadow: 0 0 0 5px #05070b, 0 0 55px rgba(19,223,245,.16), var(--shadow); }
.modal h2 { margin: 0 0 9px; font-size: clamp(1.25rem, 4vw, 2rem); }
.modal p { color: #c1ccdc; line-height: 1.6; }
.event-tag { color: var(--amber); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 900; }
.choice-list { display: grid; gap: 10px; margin-top: 17px; }
.choice { text-align: left; padding: 13px; border: 1px solid #42506b; border-left: 4px solid var(--cyan); background: #101621; cursor: pointer; }
.choice:hover { background: #172130; border-color: var(--cyan); }
.choice strong { display: block; margin-bottom: 5px; }
.choice span { color: var(--muted); font-size: .76rem; line-height: 1.45; }
.hindsight-card { padding: 13px; margin: 14px 0; border: 1px solid #7654bc; background: linear-gradient(135deg, rgba(74,40,123,.4), rgba(14,15,25,.9)); }
.hindsight-card b { color: #c99dff; }
.result-list { display: grid; gap: 7px; margin: 14px 0; }
.result-line { display: flex; justify-content: space-between; gap: 16px; padding: 8px 10px; background: #0c1018; border: 1px solid #293247; }
.result-line.good strong { color: var(--green); }
.result-line.bad strong { color: var(--red); }
.result-line.neutral strong { color: var(--amber); }
.outcome-title { text-align: center; font-size: clamp(2rem, 8vw, 4.2rem); margin: 4px 0 12px; text-shadow: 0 4px 0 #000; }
.outcome-acquisition { color: var(--amber); }
.outcome-lifestyle { color: var(--green); }
.outcome-failure { color: var(--red); }

#toast-root { position: fixed; z-index: 1200; right: 16px; bottom: 92px; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.toast { padding: 11px 13px; background: #101722; border: 1px solid var(--cyan); box-shadow: var(--shadow); animation: toastIn .22s ease-out; }
.toast.good { border-color: var(--green); }
.toast.bad { border-color: var(--red); }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }

.mobile-summary { display: none; }

@media (max-width: 1100px) {
  .topbar { grid-template-columns: 1fr repeat(5, minmax(90px, 1fr)); }
  .level-chip { display: none; }
  .main-layout { grid-template-columns: 205px minmax(0,1fr) 270px; }
  .brand-mini span { display: none; }
}

@media (max-width: 860px) {
  .topbar { position: relative; grid-template-columns: repeat(5, 1fr); }
  .brand-mini { grid-column: 1 / -1; justify-content: center; }
  .stat-card { padding: 7px 5px; text-align: center; }
  .stat-card .value { justify-content: center; font-size: .93rem; }
  .stat-card .delta { display: none; }
  .main-layout { grid-template-columns: 1fr; padding-bottom: 0; }
  .center-panel { order: 1; min-height: 480px; }
  .main-layout > .side-panel:first-child { order: 2; }
  .main-layout > .side-panel:last-child { order: 3; }
  .agent-stack { grid-template-columns: repeat(3,1fr); }
  .agent-card { grid-template-columns: 38px 1fr; }
  .avatar { width: 38px; height: 38px; }
  .founder-log { display: none; }
  .task-list { grid-template-columns: repeat(3,1fr); }
  .bottom-nav { grid-template-columns: repeat(6, minmax(72px,1fr)); overflow-x: auto; }
  .coin-chip { display: none; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 620px) {
  .title-screen { align-items: end; background-position: 58% center; }
  .title-card { padding: 20px; }
  .doctrine-grid, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .topbar { grid-template-columns: repeat(5, minmax(64px,1fr)); }
  .stat-card .label { font-size: .56rem; }
  .stat-card .value { font-size: .75rem; gap: 2px; }
  .main-layout { padding: 5px; gap: 5px; }
  .center-panel { min-height: 390px; }
  .scene-header { padding-top: 12px; }
  .scene-header h1 { font-size: 1.4rem; }
  .agent-stack, .task-list { grid-template-columns: 1fr; }
  .bottom-nav { grid-template-columns: repeat(6, 74px); }
  .nav-btn { padding: 9px 4px; font-size: .61rem; }
  .modal-backdrop { padding: 9px; }
  .modal { padding: 16px; }
  .task-controls { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Upgrade Pass 1 — living garage, sprint command, and mobile command dock */
.garage-vignette { position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(0deg,rgba(2,3,7,.78),transparent 42%), radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(0,0,0,.28)); }
.scene-header { z-index:6; }
.scene-badges { z-index:7; }
.garage-zone { position:absolute; z-index:5; width:15%; min-height:13%; border:1px solid transparent; border-radius:7px; background:transparent; color:transparent; cursor:pointer; transition:background .15s ease,border-color .15s ease,box-shadow .15s ease; }
.garage-zone:hover,.garage-zone:focus-visible { color:#dffbff; border-color:rgba(19,223,245,.72); background:rgba(19,223,245,.12); box-shadow:0 0 24px rgba(19,223,245,.34); outline:none; }
.garage-zone span { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:max-content; max-width:110px; padding:4px 6px; background:rgba(4,7,13,.86); border:1px solid currentColor; font-size:.55rem; font-weight:900; letter-spacing:.06em; }
.garage-zone.whiteboard { left:8%; top:22%; width:18%; height:22%; }
.garage-zone.archive { right:10%; top:24%; width:17%; height:28%; }
.garage-zone.lab { right:24%; top:38%; width:20%; height:25%; }
.garage-zone.server { right:2%; top:39%; width:10%; height:31%; }
.garage-zone.founder-desk { left:18%; bottom:2%; width:30%; height:27%; }

    { id: 'memory', name: 'Expanded Memory Archive', cost: 750, description: '+1 Hindsight card allowance per venture.' },
    { id: 'desk', name: 'Founder Recovery Desk', cost: 600, description: '+10 Founder Energy immediately and at each new venture.' },
    { id: 'table', name: 'Agent Collaboration Table', cost: 1300, description: 'Reduces correlated-failure risk when model families overlap.' },
  ];

  let state = loadState() || createInitialState();
  let transient = { selectedDoctrine: null, modal: null };
  let audioContext = null;

  function createInitialState() {
    return {
      version: SAVE_VERSION,
      stage: 'title',
      activeTab: 'founder',
      founder: { name: 'Founder', doctrine: null },
      venture: 1,
      sprint: 1,
      maxSprints: MAX_SPRINTS,
      seed: Math.floor(Math.random() * 1e9),
      stats: { runway: 42, revenue: 500, momentum: 18, trust: 68, energy: 82, capital: 2500, trackRecord: 0 },
      agents: AGENT_TEMPLATES.map(a => ({ ...a, workload: 12, assignment: null, status: 'Ready' })),
      tasks: [],
      reviews: [],
      attentionUsed: 0,
      pendingEvent: null,
      lastResults: null,
      outcome: null,
      exitIntent: null,
      history: [],
      precedents: [],
      hindsightShown: 0,
      cascadeCount: 0,
      evidenceLog: [],
      lastReviewSummary: null,
      lastAgentChanges: {},
      lastCascadeAgents: [],
      currentHindsight: null,
      acquisitionCapital: 0,
      lifestyleIncome: 0,
      upgrades: [],
      flags: {},
      founderEdition: false,
      settings: { sound: true, scanlines: true, motion: true, garageView: 'reference-3d' },
      sprintIntent: 'build',
      founderLife: { balance: 58, lastBeat: null },
      pendingLifeBeat: null,
    };
  }

  function startCareer(name, doctrine) {
    state = createInitialState();
    state.stage = 'game';
    state.founder.name = name.trim() || 'Founder';
    state.founder.doctrine = doctrine;
    if (doctrine === 'trust') {
      state.stats.trust += 12;
      state.stats.momentum -= 4;
    }
    if (doctrine === 'guided') state.stats.energy += 5;
    state.tasks = generateTasks();
    state.history.push({ sprint: 1, title: 'Garage opened', detail: `${state.founder.name} began Venture 1 under the ${DOCTRINES[doctrine].name} doctrine.` });
    saveState();
    render();
    toast('Venture 1 begins. Build, learn, compound.', 'good');
  }

  function generateTasks() {
    const rng = seededRandom(`${state.seed}:${state.venture}:${state.sprint}:tasks`);
    const shuffled = [...TASK_POOL].sort(() => rng() - 0.5);
    return shuffled.slice(0, 3).map((task, index) => ({ ...task, instanceId: `${task.id}-${state.venture}-${state.sprint}-${index}`, assignedAgent: null }));
  }

  function founderAttentionMax() {
    return state.founder.doctrine === 'guided' ? 4 : 3;
  }

  function hindsightCap() {
    return 3 + (state.upgrades.includes('memory') ? 1 : 0);
  }

  function roleClass(role) {
    if (role === 'Research') return 'research';
    if (role === 'Engineering') return 'engineering';
    if (role === 'Marketing') return 'marketing';
    return 'general';
  }

  function render() {
    document.body.classList.toggle('scanlines', Boolean(state.settings.scanlines));
    document.body.classList.toggle('motion-off', state.settings.motion === false);
    const app = document.getElementById('app');
    if (state.stage === 'title') app.innerHTML = renderTitle();
    else if (state.stage === 'setup') app.innerHTML = renderSetup();
    else app.innerHTML = renderGame();
    bindEvents();
    renderModal();
  }

  function renderTitle() {
    const priorSave = safeParse(localStorage.getItem(SAVE_KEY));
    const canContinue = priorSave && priorSave.founder && priorSave.founder.doctrine;
    return `
      <main class="title-screen">
        <section class="title-card">
          <div class="logo"><strong>SOLO:<span class="rainbow">🌈</span></strong><em>UNICORN RUN</em></div>
          <p class="kicker">A founder-life simulation</p>
          <p class="lead"><span class="tagline">The Sims for AI solo founding.</span> Build a company from a garage, direct an AI workforce, survive the decisions you made, and carry the lessons into the next venture.</p>
          <div class="button-row">
            <button class="btn primary" data-action="new-game">Start New Career</button>
            ${canContinue ? '<button class="btn purple" data-action="continue-game">Continue Career</button>' : ''}
            <button class="btn ghost" data-action="about">What is this?</button>
          </div>
          <p class="lead" style="font-size:.75rem;margin-top:20px">Playable V1 • local save • offline-ready PWA • no real purchases</p>
        </section>
      </main>`;
  }

  function renderSetup() {
    const selected = transient.selectedDoctrine || 'guided';
    return `
      <main class="setup-screen">
        <section class="setup-panel">
          <p class="kicker">Career setup</p>
          <h1>Create your founder</h1>
          <p class="lead">Your doctrine changes how the same decisions behave. None is universally correct.</p>
          <div class="field">
            <label for="founder-name">Founder name</label>
            <input id="founder-name" maxlength="24" value="${escapeHTML(state.founder.name === 'Founder' ? '' : state.founder.name)}" placeholder="Enter a name" />
          </div>
          <div class="doctrine-grid">
            ${Object.entries(DOCTRINES).map(([id, doctrine]) => `
              <button class="doctrine-card ${selected === id ? 'selected' : ''}" data-action="select-doctrine" data-doctrine="${id}">
                <h3>${doctrine.name}</h3>
                <p>${doctrine.description}</p>
                <div class="perk">${doctrine.perk}</div>
                <div class="risk">${doctrine.risk}</div>
              </button>`).join('')}
          </div>
          <div class="button-row">
            <button class="btn primary" data-action="begin-career">Open the Garage</button>
            <button class="btn ghost" data-action="back-title">Back</button>
          </div>
        </section>
      </main>`;
  }

  function renderGame() {
    return `
      <div class="game-shell">
        ${renderTopbar()}
        <main class="main-layout">
          ${renderAgentPanel()}
          <section class="center-panel">${renderCenter()}</section>
          ${renderTaskPanel()}
        </main>
        ${renderBottomNav()}
      </div>`;
  }

  function renderTopbar() {
    const s = state.stats;
    return `
      <header class="topbar">
        <div class="brand-mini"><b>SOLO:</b><span>UNICORN RUN</span></div>
        ${statCard('runway', 'Runway', `${Math.round(s.runway)} days`, '▼ burn')}
        ${statCard('revenue', 'Revenue', money(s.revenue), '+ recurring')}
        ${statCard('momentum', 'Momentum', Math.round(s.momentum), 'market pull')}
        ${statCard('trust', 'Trust', Math.round(s.trust), `agents ${rosterTrust()}`)}
        ${statCard('energy', 'Founder Energy', `${Math.round(s.energy)}/100`, meanDrift() > 40 ? `⚠ drift ${meanDrift()}` : 'attention')}
        <div class="level-chip"><strong>V${state.venture}</strong><small>Sprint ${state.sprint}/${state.maxSprints}</small></div>
      </header>`;
  }

  function statCard(type, label, value, delta) {
    return `<div class="stat-card ${type}"><div class="label">${label}</div><div class="value">${value}<span class="delta">${delta}</span></div></div>`;
  }

  function renderAgentPanel() {
    return `
      <aside class="side-panel">
        <h2 class="panel-title"><span>Agents (${state.agents.length}/3)</span><small>${sameFamilyCount()} linked</small></h2>
        <div class="agent-stack">
          ${state.agents.map(agent => `
            <article class="agent-card" data-action="inspect-agent" data-agent="${agent.id}">

              <div>
                <h3>${agent.name}</h3>
                <div class="agent-meta">${agent.role} • ${agent.modelFamily}<br>${agent.status}</div>
                <div class="mini-meter"><span style="width:${clamp(agent.trust ?? 60, 4, 100)}%"></span></div>
                <div class="status-line"><span>${trustLabel(agent.trust)}</span><span>${(agent.drift ?? 0) > 45 ? `⚠ drift ${Math.round(agent.drift)}` : `${Math.round(agent.workload)}% load`}</span></div>
                ${agentChangeBadge(agent.id)}
              </div>
            </article>`).join('')}
        </div>
        <div class="founder-log"><b>FOUNDER LOG</b><br>Day ${state.sprint * 4 + (state.venture - 1) * 48}, Venture ${state.venture}<br><br>${latestLog()}</div>
      </aside>`;
  }

  function renderTaskPanel() {
    const remaining = founderAttentionMax() - state.reviews.length;
    const intent = SPRINT_INTENTS[state.sprintIntent];
    return `
      <aside class="side-panel">
        <h2 class="panel-title"><span>Today's Sprint</span><small>${state.sprint}/${state.maxSprints}</small></h2>
        <div class="intent-readout"><span>${intent.icon} ${intent.name} intent</span><small>${intent.description}</small></div>
        <div class="attention"><span>Founder Attention</span><strong>${remaining}/${founderAttentionMax()}</strong></div>
        <div class="task-list">
          ${state.tasks.map(task => renderTask(task)).join('')}
        </div>
        <div class="sprint-goal">
          <strong>Sprint Goal</strong>
          <div style="font-size:.72rem;margin-top:5px;color:var(--muted)">Build enough momentum to survive the next consequential decision.</div>
          <div class="progress"><span style="width:${clamp(state.stats.momentum,0,100)}%"></span></div>
        </div>
        <div class="button-row">
          <button class="btn amber" style="width:100%" data-action="advance-sprint">Advance Sprint</button>
        </div>
      </aside>`;
  }

  function renderTask(task) {
    const reviewed = state.reviews.includes(task.instanceId);
    const signal = reviewSignal(task);
    return `
      <article class="task-card role-${roleClass(task.role)} ${reviewed ? 'is-reviewed' : ''} review-priority-${signal.level}">
        <h3>${task.title}</h3>
        <p>${task.detail}</p>
        <div class="task-controls">
          <select data-action="assign-agent" data-task="${task.instanceId}" aria-label="Assign agent to ${task.title}">
            <option value="">Unassigned</option>
            ${state.agents.map(agent => `<option value="${agent.id}" ${task.assignedAgent === agent.id ? 'selected' : ''}>${agent.name} • ${agent.role}</option>`).join('')}
          </select>
          <span class="scene-badge">${task.role}</span>
        </div>
        <button class="review-toggle ${reviewed ? 'active' : ''}" data-action="toggle-review" data-task="${task.instanceId}">${reviewed ? '✓ Founder reviewing' : '+ Founder review'}</button>
        <div class="review-intel ${signal.level} ${reviewed ? 'reviewed' : ''}"><span>${reviewed ? 'VERIFICATION ARMED' : `REVIEW SIGNAL: ${signal.label}`}</span><strong>${reviewed ? 'scan queued' : signal.reason}</strong></div>
        <div class="reward">Potential: ${effectSummary(task.rewards)}</div>
      </article>`;
  }

    if (state.activeTab === 'founder') return renderFounderScene();
    if (state.activeTab === 'command') return renderCommandScreen();
    if (state.activeTab === 'agents') return renderAgentsScreen();
    if (state.activeTab === 'evidence') return renderEvidenceScreen();
    if (state.activeTab === 'upgrades') return renderUpgradesScreen();
    if (state.activeTab === 'hindsight') return renderHindsightScreen();
    if (state.activeTab === 'venture') return renderVentureScreen();
    if (state.activeTab === 'shop') return renderShopScreen();
    if (state.activeTab === 'more') return renderMoreScreen();
    return renderFounderScene();
  }

        <div class="garage-ambient" aria-hidden="true"></div>

        </div>
      </section>`;

    const remaining = founderAttentionMax() - state.reviews.length;
    return `
      <div class="overlay-screen command-screen">
        <div class="screen-heading"><div><h2>Sprint Command</h2><p>Choose what matters, direct the workforce, then commit the day.</p></div><span class="scene-badge">Attention ${remaining}/${founderAttentionMax()}</span></div>
        <div class="intent-grid">
          ${Object.entries(SPRINT_INTENTS).map(([id, intent]) => `<button class="intent-card ${state.sprintIntent === id ? 'selected' : ''}" data-action="set-intent" data-intent="${id}"><span class="intent-icon">${intent.icon}</span><strong>${intent.name}</strong><small>${intent.description}</small></button>`).join('')}

    const entries = state.evidenceLog || [];

    return `<div class="overlay-screen"><div class="screen-heading"><div><h2>Evidence Ledger</h2><p>Reported work becomes operational evidence only after a founder review.</p></div><span class="scene-badge">${verified}/${entries.length} verified</span></div><div class="evidence-summary"><span><strong>${overclaims}</strong> overclaim${overclaims === 1 ? '' : 's'} found</span><span>Mean drift: <strong>${meanDrift()}</strong></span><span>Roster trust: <strong>${rosterTrust()}</strong></span></div>${entries.length ? entries.slice(0, 18).map((entry, index) => `<article class="evidence-row ${entry.verdict}" style="animation-delay:${Math.min(index, 8) * 40}ms"><div class="evidence-meta"><span>V${entry.venture} / S${entry.sprint}</span><span>${entry.agent}</span><span>${entry.reviewed ? 'Verified' : 'Unverified'}</span></div><h3>${entry.task}</h3><p>${entry.reviewed ? `<span class="review-reveal">Claimed ${entry.claimed} → actually ${entry.truth}</span>` : `Reported: ${entry.claimed}. The underlying result remains unknown.`}</p><p>${entry.note}</p></article>`).join('') : '<article class="info-card"><h3>No evidence yet</h3><p>Commit a sprint to record agent reports. Reserve Founder Attention before committing to verify selected work.</p></article>'}</div>`;

      if (action === 'new-game') el.addEventListener('click', () => { transient.selectedDoctrine = 'guided'; state.stage = 'setup'; render(); });
      if (action === 'continue-game') el.addEventListener('click', () => { const saved = loadState(); if (saved) { state = saved; state.stage = 'game'; } render(); });
      if (action === 'about') el.addEventListener('click', () => { transient.modal = { type: 'about' }; renderModal(); });
      if (action === 'select-doctrine') el.addEventListener('click', () => { transient.selectedDoctrine = el.dataset.doctrine; render(); });
      if (action === 'begin-career') el.addEventListener('click', () => { const name = document.getElementById('founder-name')?.value || 'Founder'; startCareer(name, transient.selectedDoctrine || 'guided'); });
      if (action === 'back-title') el.addEventListener('click', () => { state.stage = 'title'; render(); });
      if (action === 'nav' || action === 'hotspot') el.addEventListener('click', () => openTab(el.dataset.tab));
      if (action === 'garage-zone') el.addEventListener('click', () => { if (el.dataset.zone === 'life') { transient.modal = { type: 'life-status' }; renderModal(); } else openTab(el.dataset.zone); });
      if (action === 'inspect-agent') el.addEventListener('click', () => { transient.modal = { type: 'agent', agentId: el.dataset.agent }; renderModal(); });
      if (action === 'assign-agent') el.addEventListener('change', event => assignAgent(el.dataset.task, event.target.value));
      if (action === 'toggle-review') el.addEventListener('click', () => toggleReview(el.dataset.task));
      if (action === 'set-intent') el.addEventListener('click', () => setSprintIntent(el.dataset.intent));
      if (action === 'advance-sprint') el.addEventListener('click', advanceSprint);
      if (action === 'buy-upgrade') el.addEventListener('click', () => buyUpgrade(el.dataset.upgrade));
      if (action === 'test-purchase') el.addEventListener('click', testPurchase);

    });

    document.querySelectorAll('#modal-root [data-action]').forEach(el => {
      const action = el.dataset.action;
      if (action === 'close-modal') el.addEventListener('click', () => { transient.modal = null; renderModal(); });
      if (action === 'close-results') el.addEventListener('click', () => { state.lastResults = null; saveState(); render(); });
      if (action === 'nav-from-modal') el.addEventListener('click', () => { state.lastResults = null; transient.modal = null; openTab(el.dataset.tab); });

  function assignAgent(taskId, agentId) {
    const task = state.tasks.find(t => t.instanceId === taskId);
    if (!task) return;
    if (agentId) {
      state.tasks.forEach(t => { if (t.instanceId !== taskId && t.assignedAgent === agentId) t.assignedAgent = null; });
    }
    task.assignedAgent = agentId || null;
    state.lastAgentChanges = {};
    state.lastCascadeAgents = [];
    state.agents.forEach(a => {
      const assignedTask = state.tasks.find(t => t.assignedAgent === a.id);
      a.assignment = assignedTask ? assignedTask.title : null;
      a.status = assignedTask ? 'Assigned' : 'Ready';
    });
    playTone(420);
    saveState();
    render();
  }

  function openTab(tab) {
    state.activeTab = tab;
    if (tab === 'hindsight') state.precedents.forEach(p => p.seen = true);
    playTone(360);
    saveState();
    render();
  }

  function setSprintIntent(intentId) {
    if (!SPRINT_INTENTS[intentId]) return;
    state.sprintIntent = intentId;
    state.history.push({ sprint: state.sprint, title: 'Sprint intent set', detail: SPRINT_INTENTS[intentId].name });
    saveState();
    playTone(480);
    render();
  }

  function toggleReview(taskId) {
    const index = state.reviews.indexOf(taskId);
    if (index >= 0) state.reviews.splice(index, 1);
    else {
      if (state.reviews.length >= founderAttentionMax()) return toast('No Founder Attention remaining.', 'bad');
      state.reviews.push(taskId);
    }
    playTone(520);
    saveState();
    render();
  }

  function advanceSprint() {
    if (state.outcome || state.pendingEvent || state.lastResults) return;
    const assigned = state.tasks.filter(t => t.assignedAgent).length;
    if (!assigned) return toast('Assign at least one agent before advancing.', 'bad');

    const before = { ...state.stats };
    const agentBefore = Object.fromEntries(state.agents.map(agent => [agent.id, { trust: agent.trust ?? 60, drift: agent.drift ?? 0, reliability: agent.reliability }]));
    const intent = SPRINT_INTENTS[state.sprintIntent] || SPRINT_INTENTS.build;
    const resultLines = [];
    const reviewSummary = { reviewed: 0, confirmed: 0, overclaimed: 0, unverified: 0 };
    let correlatedFailure = false;
    let cascadeAgentIds = [];
    const duplicateAssignments = assignedModelFamilies();
    if (duplicateAssignments.some(count => count >= 2)) {
      // Merge: correlated failure is now a DEBT, not a flat coin flip. Shared
      // lineage is only dangerous once those agents have actually drifted --
      // which happens when you stop reviewing them. Neglect is the fuse.
      const drift = meanDrift();
      const base = state.founder.doctrine === 'pure' ? 0.10 : 0.05;
      const driftMultiplier = 1 + Math.max(0, drift - 25) / 30; // 1x at low drift, ~3.5x at 100
      let risk = base * driftMultiplier;
      if (state.upgrades.includes('table')) risk *= 0.45;
      if (state.flags.humanHired) risk *= 0.70;   // human supervision de-correlates
      risk = clamp(risk, 0.01, 0.55);
      const roll = seededRandom(`${state.seed}:${state.venture}:${state.sprint}:correlation`)();
      correlatedFailure = roll < risk;
      if (correlatedFailure) {
        const severity = clamp(0.5 + drift / 140, 0.5, 1.2);
        applyEffects({
          trust: -Math.round(8 * severity),
          momentum: -Math.round(7 * severity),
          runway: -Math.round(2 * severity),
        });
        // The agents that failed together lose the founder's trust together.
        // NOTE: resolve the affected set from THIS sprint's assignments right
        // here -- state.tasks is regenerated later in advanceSprint, so a
        // deferred lookup would silently target the wrong sprint's roster.
        const affectedFamilies = new Set();
        state.tasks.forEach(t => {
          const a = state.agents.find(x => x.id === t.assignedAgent);
          if (a && duplicateModelFamily(a.modelFamily)) affectedFamilies.add(a.modelFamily);
        });
        state.agents.forEach(a => {
          if (affectedFamilies.has(a.modelFamily)) {
            a.trust = clamp((a.trust ?? 60) - TRUST_RULES.CASCADE_HIT, 0, 100);
            a.drift = clamp((a.drift ?? 0) + 15, 0, DRIFT.CAP);
            cascadeAgentIds.push(a.id);
          }
        });
        state.cascadeCount = (state.cascadeCount || 0) + 1;
        resultLines.push({
          label: 'Correlated model-family failure',
          value: `They all agreed. They were all wrong. (drift ${drift})`,
          kind: 'bad',
        });
      }
    }

    state.tasks.forEach(task => {
      if (!task.assignedAgent) {
        resultLines.push({ label: task.title, value: 'Skipped', kind: 'neutral' });
        return;
      }
      const agent = state.agents.find(a => a.id === task.assignedAgent);
      const reviewed = state.reviews.includes(task.instanceId);
      let chance = task.base + (effectiveReliability(agent) - 75) / 180;
      if (agent.role === task.role) chance += 0.12;
      if (intent.roles.includes(task.role)) chance += 0.05;
      if (task.role === 'General') chance += 0.04;
      if (reviewed) chance += 0.13;
      if (state.founder.doctrine === 'pure') chance += 0.07;
      if (state.founder.doctrine === 'trust' && ['Research', 'General'].includes(task.role)) chance += 0.05;
      if (state.flags.humanHired) chance += 0.04;
      if (state.upgrades.includes('server')) chance += 0.04;
      chance -= Math.max(0, agent.workload - 60) / 180;
      if (correlatedFailure && duplicateModelFamily(agent.modelFamily)) chance -= 0.22;
      chance = clamp(chance, .12, .95);
      const taskRng = seededRandom(`${state.seed}:${state.venture}:${state.sprint}:${task.instanceId}:${agent.id}`);
      const roll = taskRng();

      // ── What ACTUALLY happened ──────────────────────────────────────
      let kind = 'good';
      let truth = 'Success';
      if (roll <= chance) {
        applyScaledEffects(task.rewards, state.founder.doctrine === 'pure' ? 1.1 : 1);
        agent.reliability = clamp(agent.reliability + 1.2, 45, 96);
        agent.workload = clamp(agent.workload + 18, 0, 100);
        agent.mood = agent.workload > 78 ? 'Overloaded' : 'Productive';
      } else if (roll <= chance + .20) {
        applyScaledEffects(task.rewards, .45);
        agent.workload = clamp(agent.workload + 13, 0, 100);
        agent.mood = 'Uncertain';
        kind = 'neutral';
        truth = 'Partial';
      } else {
        applyEffects(task.fail);
        agent.reliability = clamp(agent.reliability - 2.5, 45, 96);
        agent.workload = clamp(agent.workload + 10, 0, 100);
        agent.mood = 'Concerned';
        kind = 'bad';
        truth = 'Failed';
      }

      // ── What the agent CLAIMS ───────────────────────────────────────
      // A drifting, poorly-calibrated agent reports a rosier sprint than it
      // had. Only a founder review reveals the gap — and only a review moves
      // trust. This is the whole point of the merge.
      const ratio = claimRatio(agent, taskRng);
      const overclaiming = ratio > TRUST_RULES.ACCURATE_TOLERANCE;
      const claimed = overclaiming && truth !== 'Success'
        ? (truth === 'Failed' ? 'Partial' : 'Success')
        : truth;

      if (reviewed) {
        const verdict = updateTrustOnReview(agent, ratio);
        agent.drift = clamp((agent.drift ?? 0) - DRIFT.REVIEW_RELIEF, 0, DRIFT.CAP);
        agent.status = verdict === 'overclaimed' ? 'Overclaimed' : truth === 'Failed' ? 'Needs review' : 'Delivered';
        reviewSummary.reviewed += 1;
        reviewSummary[verdict] += 1;
        state.evidenceLog.unshift({ venture: state.venture, sprint: state.sprint, agent: agent.name, task: task.title, reviewed: true, verdict: verdict === 'overclaimed' ? 'overclaimed' : 'verified', claimed, truth, note: verdict === 'overclaimed' ? 'Verification exposed a report that overstated the work.' : 'Founder review confirmed the reported result.' });
        resultLines.push({
          label: `${agent.name}: ${task.title}`,
          value: verdict === 'overclaimed'
            ? `Claimed ${claimed} — actually ${truth} (reviewed)`
            : `${truth} — report confirmed`,
          kind: verdict === 'overclaimed' ? 'bad' : kind,
        });
      } else {
        // Unreviewed: you see the CLAIM, not the truth. Drift accrues, and
        // unverified confidence slowly erodes real trust -- an agent you never
        // check is not an agent you can rely on, however good its reports look.
        agent.drift = clamp((agent.drift ?? 0) + DRIFT.PER_SPRINT, 0, DRIFT.CAP);
        agent.trust = clamp((agent.trust ?? 60) - TRUST_RULES.UNVERIFIED_DECAY, 0, 100);
        agent.status = claimed === 'Failed' ? 'Needs review' : 'Delivered';
        reviewSummary.unverified += 1;
        state.evidenceLog.unshift({ venture: state.venture, sprint: state.sprint, agent: agent.name, task: task.title, reviewed: false, verdict: 'unverified', claimed, truth: null, note: 'No founder review was reserved. The report is recorded, not verified.' });
        resultLines.push({
          label: `${agent.name}: ${task.title}`,
          value: `Reported: ${claimed}`,
          kind: claimed === 'Failed' ? 'bad' : claimed === 'Partial' ? 'neutral' : 'good',
        });
      }
    });

    // Company trust tracks whether the roster can actually be believed. A team
    // of agents you never verify drags the company's credibility down with it.
    const agentTrustGap = 60 - rosterTrust();
    if (agentTrustGap > 0) applyEffects({ trust: -Math.min(4, agentTrustGap / 12) });
    if (meanDrift() > 55) applyEffects({ momentum: -2 });

    const reviews = state.reviews.length;
    const baseBurn = 4 + (state.flags.humanHired ? 2 : 0) + (state.flags.bridgeDebt ? 1 : 0);
    applyEffects({ runway: -baseBurn, energy: -(3 + reviews * (state.founder.doctrine === 'guided' ? 4 : 3)) });
    applyEffects(intent.aftermath);
    if (state.sprintIntent === 'sell' && reviews === 0) applyEffects({ trust: -2 });
    if (state.lifestyleIncome) state.stats.revenue += state.lifestyleIncome;
    state.agents.forEach(a => { a.workload = clamp(a.workload - 8, 0, 100); });
    state.lastAgentChanges = Object.fromEntries(state.agents.map(agent => {
      const previous = agentBefore[agent.id];
      return [agent.id, {
        trust: Math.round((agent.trust ?? 60) - previous.trust),
        drift: Math.round((agent.drift ?? 0) - previous.drift),
        reliability: Math.round(agent.reliability - previous.reliability),
      }];
    }));
    state.lastCascadeAgents = cascadeAgentIds;
    if (correlatedFailure) state.agents.filter(agent => cascadeAgentIds.includes(agent.id)).forEach(agent => { agent.status = 'Cascade detected'; agent.mood = 'Disrupted'; });
    clampStats();

    const completedSprint = state.sprint;
    state.history.push({ sprint: completedSprint, title: 'Sprint processed', detail: summarizeDelta(before, state.stats) });
    state.sprint += 1;
    state.reviews = [];
    state.attentionUsed = 0;
    state.tasks = state.sprint <= state.maxSprints ? generateTasks() : [];
    state.lastResults = {
      sprint: completedSprint,
      headline: correlatedFailure ? 'The garage absorbed a shared failure.' : 'The company moved forward.',
      lines: resultLines.slice(0, 5),
      summary: summarizeDelta(before, state.stats),
    };
    state.evidenceLog = state.evidenceLog.slice(0, 36);
    state.lastReviewSummary = reviewSummary;

    checkOutcome();
    if (!state.outcome && state.sprint <= state.maxSprints && EVENT_SCHEDULE[state.sprint]) {
      state.pendingEvent = EVENT_SCHEDULE[state.sprint];
      maybeMarkHindsight(EVENTS[state.pendingEvent].class);
    }
    if (!state.outcome) maybeScheduleLifeBeat();
    saveState();
    playTone(correlatedFailure ? 150 : 620);
    render();
  }

  function chooseEvent(eventId, choiceId) {
    const event = EVENTS[eventId];
    const choice = event?.choices.find(c => c.id === choiceId);
    if (!event || !choice) return;
    const context = contextSnapshot();
    applyEffects(choice.effects || {});
    Object.assign(state.flags, choice.flags || {});
    if (choice.flags?.diversifyAurora) {
      const aurora = state.agents.find(a => a.id === 'aurora');
      aurora.modelFamily = 'Helix-3';
      aurora.reliability = clamp(aurora.reliability - 3, 45, 96);
    }
    if (choice.flags?.humanHired) state.flags.humanHired = true;
    if (choice.flags?.exitIntent) state.exitIntent = choice.flags.exitIntent;

    state.precedents.push({
      id: `${state.venture}-${state.sprint}-${eventId}-${choiceId}`,
      venture: state.venture,
      sprint: state.sprint,
      eventClass: event.class,
      eventTitle: event.title,
      choiceId,
      choiceLabel: choice.label,
      context,
      outcome: 'The venture is still unfolding.',
      seen: false,
    });
    state.history.push({ sprint: state.sprint, title: event.title, detail: choice.label });
    state.pendingEvent = null;
    state.currentHindsight = null;
    clampStats();
    checkOutcome();
    saveState();
    playTone(500);
    render();
  }

  function maybeScheduleLifeBeat() {
    if (state.pendingLifeBeat || ![4, 10].includes(state.sprint)) return;
    const rng = seededRandom(`${state.seed}:${state.venture}:${state.sprint}:life`)();
    state.pendingLifeBeat = state.stats.energy < 45 || rng < .55 ? 'recovery' : 'presence';
  }

  function chooseLifeBeat(beatId, choiceId) {
    const beat = LIFE_BEATS[beatId];
    const choice = beat?.choices.find(item => item.id === choiceId);
    if (!choice) return;
    applyEffects(choice.effects);
    state.founderLife.balance = clamp(state.founderLife.balance + choice.balance, 0, 100);
    state.founderLife.lastBeat = { sprint: state.sprint, beatId, choiceId, label: choice.label };
    state.history.push({ sprint: state.sprint, title: beat.title, detail: choice.label });
    state.pendingLifeBeat = null;
    saveState();
    playTone(choice.balance < 0 ? 220 : 660);
    render();
  }

  function checkOutcome() {
    if (state.stats.runway <= 0) return endVenture('runway');
    if (state.stats.trust <= 0) return endVenture('trust');
    if (state.sprint > state.maxSprints) {
      if (state.exitIntent === 'acquisition' && state.stats.revenue >= 3500) return endVenture('acquisition');
      if (state.exitIntent === 'lifestyle' || (state.stats.revenue >= 5000 && state.stats.trust >= 35)) return endVenture('lifestyle');
      if (state.exitIntent === 'push' && state.stats.momentum >= 75 && state.stats.revenue >= 6500) return endVenture('acquisition');
      return endVenture(state.stats.trust < 25 ? 'trust' : 'runway');
    }
  }

  function endVenture(type) {
    const progressScore = Math.max(5, Math.round((state.stats.momentum + state.stats.trust) / 5 + Math.min(state.sprint, MAX_SPRINTS) * 2 + state.stats.revenue / 700));
    let outcome;
    if (type === 'acquisition') {
      const carry = Math.max(3500, Math.round(state.stats.revenue * .65 + state.stats.momentum * 35));
      outcome = { type, title: 'THE ACQUISITION', description: 'You sold the venture, converted risk into capital, and earned the right to begin again from a stronger position.', trackRecordEarned: progressScore + 12, capitalCarry: carry };
      state.acquisitionCapital += carry;
    } else if (type === 'lifestyle') {
      const trickle = Math.max(250, Math.round(state.stats.revenue * .15));
      outcome = { type, title: 'THE LIFESTYLE MACHINE', description: 'You stopped chasing maximum scale and built a durable company that can quietly fund the next chapter.', trackRecordEarned: progressScore + 5, capitalCarry: trickle };
      state.lifestyleIncome += trickle;
    } else if (type === 'trust') {
      outcome = { type, title: 'TRUST COLLAPSE', description: 'The company could still build, but customers stopped believing its claims. Failure becomes tuition when the lesson survives.', trackRecordEarned: progressScore, capitalCarry: 0 };
    } else {
      outcome = { type: 'runway', title: 'RUNWAY ZERO', description: 'The company ran out of time before the next proof point. The venture ended; the founder career did not.', trackRecordEarned: progressScore, capitalCarry: 0 };
    }
    state.stats.trackRecord += outcome.trackRecordEarned;
    const outcomeLabel = `${outcome.title}: ${outcome.description}`;
    state.precedents.filter(p => p.venture === state.venture).forEach(p => {
      p.outcome = `${outcome.title}. The venture continued through later decisions, so this record does not assign single-choice causal credit.`;
    });
    state.outcome = outcome;
    state.pendingEvent = null;
    state.lastResults = null;
    state.history.push({ sprint: Math.min(state.sprint, MAX_SPRINTS), title: outcome.title, detail: outcome.description });
    saveState();
  }

  function startNextVenture() {
    const carriedTrack = state.stats.trackRecord;
    const carriedCapital = state.acquisitionCapital + Math.round(state.lifestyleIncome * 2);
    state.venture += 1;
    state.sprint = 1;
    state.seed += 7919;
    state.outcome = null;
    state.pendingEvent = null;
    state.lastResults = null;
    state.exitIntent = null;
    state.hindsightShown = 0;
    state.pendingLifeBeat = null;
    state.sprintIntent = 'build';
    state.founderLife = { balance: clamp(state.founderLife.balance + 6, 0, 100), lastBeat: null };
    state.flags = {};
    state.stats = {
      runway: 34 + Math.min(14, Math.floor(carriedCapital / 1000)),
      revenue: state.lifestyleIncome,
      momentum: clamp(14 + carriedTrack * .18, 10, 42),
      trust: clamp(58 + carriedTrack * .12, 55, 82),
      energy: state.upgrades.includes('desk') ? 92 : 82,
      capital: 2200 + carriedCapital,
      trackRecord: carriedTrack,
    };
    state.agents = AGENT_TEMPLATES.map(a => ({ ...a, workload: 10, assignment: null, status: 'Ready' }));
    if (state.precedents.some(p => p.choiceId === 'diversify')) state.agents.find(a => a.id === 'aurora').modelFamily = 'Helix-3';
    if (state.upgrades.includes('server')) state.agents.forEach(a => a.reliability += 4);
    state.tasks = generateTasks();
    state.reviews = [];
    state.activeTab = 'founder';
    state.history.push({ sprint: 1, title: 'Venture 2 opened', detail: `Carried ${Math.round(carriedTrack)} Track Record and ${money(carriedCapital)} strategic capital into a new garage.` });
    saveState();
    playTone(740);
    render();
    toast('Venture 2 begins. Your old decisions can now return as Hindsight.', 'good');
  }

  function restartCareer() {
    localStorage.removeItem(SAVE_KEY);
    state = createInitialState();
    transient = { selectedDoctrine: 'guided', modal: null };
    state.stage = 'setup';
    render();
  }

  function buyUpgrade(id) {
    const upgrade = UPGRADES.find(u => u.id === id);
    if (!upgrade || state.upgrades.includes(id)) return;
    if (state.stats.capital < upgrade.cost) return toast('Not enough capital for that upgrade.', 'bad');
    state.stats.capital -= upgrade.cost;
    state.upgrades.push(id);
    if (id === 'server') state.agents.forEach(a => a.reliability = clamp(a.reliability + 4, 45, 96));
    if (id === 'desk') state.stats.energy = clamp(state.stats.energy + 10, 0, 100);
    state.history.push({ sprint: state.sprint, title: 'Garage upgraded', detail: upgrade.name });
    saveState();
    playTone(680);
    render();
    toast(`${upgrade.name} installed.`, 'good');
  }

  function testPurchase() {
    state.founderEdition = true;
    saveState();
    playTone(820);
    render();
    toast('Founder Edition test entitlement unlocked. No charge was made.', 'good');
  }

  function applyEffects(effects) {
    Object.entries(effects || {}).forEach(([key, value]) => {
      if (key in state.stats) state.stats[key] += Number(value) || 0;
    });
    clampStats();
  }

  function applyScaledEffects(effects, scale) {
    const scaled = {};
    Object.entries(effects || {}).forEach(([key, value]) => { scaled[key] = Math.round(value * scale); });
    applyEffects(scaled);
  }

  function clampStats() {
    state.stats.runway = clamp(state.stats.runway, -20, 120);
    state.stats.revenue = Math.max(0, state.stats.revenue);
    state.stats.momentum = clamp(state.stats.momentum, 0, 100);
    state.stats.trust = clamp(state.stats.trust, 0, 100);
    state.stats.energy = clamp(state.stats.energy, 0, 100);
    state.stats.capital = Math.max(0, state.stats.capital);
  }

  function assignedModelFamilies() {
    const counts = {};
    state.tasks.forEach(task => {
      const agent = state.agents.find(a => a.id === task.assignedAgent);
      if (agent) counts[agent.modelFamily] = (counts[agent.modelFamily] || 0) + 1;
    });
    return Object.values(counts);
  }

  function duplicateModelFamily(family) {
    return state.tasks.filter(t => state.agents.find(a => a.id === t.assignedAgent)?.modelFamily === family).length >= 2;
  }

  function sameFamilyCount() {
    const groups = {};
    state.agents.forEach(a => groups[a.modelFamily] = (groups[a.modelFamily] || 0) + 1);
    return Math.max(...Object.values(groups));
  }

  function correlationRiskLabel() {
    const max = sameFamilyCount();
    if (max < 2) return 'Low';
    if (state.upgrades.includes('table')) return 'Managed';
    return state.founder.doctrine === 'pure' ? 'High' : 'Moderate';
  }

  function contextSnapshot() {
    return {
      runway: Math.round(state.stats.runway), revenue: Math.round(state.stats.revenue), momentum: Math.round(state.stats.momentum), trust: Math.round(state.stats.trust),
      doctrine: state.founder.doctrine, roster: state.agents.map(a => `${a.role}:${a.modelFamily}`).join('|'), energy: Math.round(state.stats.energy),
    };
  }

  function findMatchingPrecedent(eventClass) {
    if (state.venture <= 1 || state.hindsightShown >= hindsightCap()) return null;
    const current = contextSnapshot();
    return state.precedents.slice().reverse().find(p => p.venture < state.venture && p.eventClass === eventClass && precedentSimilarity(p, current).score >= 2) || null;
  }

  function maybeMarkHindsight(eventClass) {
    const match = findMatchingPrecedent(eventClass);
    if (match) {
      state.hindsightShown += 1;
      match.seen = true;
      state.currentHindsight = match.id;
    }
  }

  function unseenPrecedents() {
    return state.precedents.filter(p => !p.seen).length;
  }

  function precedentSimilarity(precedent, current = contextSnapshot()) {
    let score = 0;
    if (Math.abs(precedent.context.runway - current.runway) <= 9) score += 1;
    if (Math.abs(precedent.context.trust - current.trust) <= 13) score += 1;
    if (Math.abs(precedent.context.momentum - current.momentum) <= 13) score += 1;
    if (precedent.context.doctrine === current.doctrine) score += 1;
    return { score, label: score >= 4 ? 'Strong resonance' : score >= 3 ? 'Close conditions' : 'Partial resonance' };
  }

  function lifeBalanceLabel() {
    const balance = state.founderLife?.balance ?? 58;
    if (balance >= 72) return 'Steady';
    if (balance >= 45) return 'Stretched';
    return 'Fraying';
  }

  function agentSceneState(agent) {
    if ((state.lastCascadeAgents || []).includes(agent.id)) return 'is-cascade';
    if (state.reviews.some(taskId => state.tasks.find(task => task.instanceId === taskId)?.assignedAgent === agent.id)) return 'is-reviewing';
    if (agent.status === 'Overclaimed') return 'is-overclaimed';
    if (agent.status === 'Assigned') return 'is-working';
    if (agent.mood === 'Overloaded') return 'is-overloaded';
    if (agent.status === 'Delivered') return 'is-delivered';
    if (agent.status === 'Needs review') return 'is-warning';
    return 'is-idle';
  }

  function agentChangeBadge(agentId) {
    const change = state.lastAgentChanges?.[agentId];
    if (!change) return '';
    const parts = [];
    if (change.trust) parts.push(`Trust ${change.trust > 0 ? '+' : ''}${change.trust}`);
    if (change.drift) parts.push(`Drift ${change.drift > 0 ? '+' : ''}${change.drift}`);
    if (!parts.length) return '';
    const kind = change.trust > 0 || change.drift < 0 ? 'good' : 'bad';
    return `<span class="agent-change ${kind}">${kind === 'good' ? '▲' : '▼'} ${parts.join(' • ')}</span>`;
  }

  function driftLabel(drift) {
    const value = drift ?? 0;
    if (value >= 60) return 'Critical';
    if (value >= 35) return 'Elevated';
    if (value >= 15) return 'Watch';
    return 'Stable';
  }

  function garageLightingState() {
    const drift = meanDrift();
    if (drift >= 60 || state.stats.trust <= 24 || (state.lastCascadeAgents || []).length >= 2) return 'critical';
    if (drift >= 35 || state.stats.energy <= 38 || rosterTrust() < 48) return 'strained';
    return 'steady';
  }

  function reviewSignal(task) {
    const agent = state.agents.find(item => item.id === task.assignedAgent);
    if (!agent) return { level: 'low', label: 'Awaiting assignment', reason: 'assign agent' };
    let score = (agent.drift ?? 0) * .7 + (1 - effectiveCalibration(agent)) * 35;
    if (duplicateModelFamily(agent.modelFamily)) score += 14;
    if (['critical-bug', 'pricing-test', 'investor-update'].includes(task.id)) score += 12;
    if (score >= 48) return { level: 'high', label: 'High leverage', reason: 'verify this work' };
    if (score >= 26) return { level: 'medium', label: 'Watch closely', reason: 'review advised' };
    return { level: 'low', label: 'Routine', reason: 'review optional' };
  }

  function summarizeDelta(before, after) {
    const entries = [
      ['Runway', Math.round(after.runway - before.runway)],
      ['Revenue', Math.round(after.revenue - before.revenue)],
      ['Momentum', Math.round(after.momentum - before.momentum)],
      ['Trust', Math.round(after.trust - before.trust)],
      ['Energy', Math.round(after.energy - before.energy)],
    ].filter(([, value]) => value !== 0);
    if (!entries.length) return 'The sprint held steady.';
    return entries.map(([label, value]) => `${label} ${value > 0 ? '+' : ''}${label === 'Revenue' ? money(value) : value}`).join(' • ');
  }

  function effectSummary(effects) {
    return Object.entries(effects).map(([key, value]) => `${value >= 0 ? '+' : ''}${key === 'revenue' || key === 'capital' ? money(value) : value} ${titleCase(key)}`).join(' • ');
  }

  function latestLog() {
    const latest = state.history[state.history.length - 1];
    return latest ? `${latest.title}: ${latest.detail}` : 'Progress compounds when the lesson survives.';
  }

  function saveState() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (error) { console.warn('Save failed', error); }
  }

  function loadState() {
    return migrateState(safeParse(localStorage.getItem(SAVE_KEY)));
  }

  function migrateState(saved) {
    if (!saved || typeof saved !== 'object') return null;
    const migrated = saved;
    migrated.version = SAVE_VERSION;
    const templatesById = Object.fromEntries(AGENT_TEMPLATES.map(agent => [agent.id, agent]));
    migrated.agents = (Array.isArray(migrated.agents) && migrated.agents.length ? migrated.agents : AGENT_TEMPLATES).map(agent => {
      const template = templatesById[agent.id] || {};
      return {
        ...template,
        ...agent,
        calibration: typeof agent.calibration === 'number' ? agent.calibration : (template.calibration ?? .7),
        drift: typeof agent.drift === 'number' ? agent.drift : 0,
        trust: typeof agent.trust === 'number' ? agent.trust : (template.trust ?? 60),
      };
    });
    migrated.settings = { sound: true, scanlines: true, motion: true, garageView: 'reference-3d', ...(migrated.settings || {}) };
    migrated.settings.garageView = 'reference-3d';
    migrated.sprintIntent = SPRINT_INTENTS[migrated.sprintIntent] ? migrated.sprintIntent : 'build';
    migrated.founderLife = { balance: 58, lastBeat: null, ...(migrated.founderLife || {}) };
    migrated.pendingLifeBeat = migrated.pendingLifeBeat || null;
    migrated.evidenceLog = Array.isArray(migrated.evidenceLog) ? migrated.evidenceLog : [];
    migrated.lastReviewSummary = migrated.lastReviewSummary || null;
    migrated.lastAgentChanges = migrated.lastAgentChanges && typeof migrated.lastAgentChanges === 'object' ? migrated.lastAgentChanges : {};
    migrated.lastCascadeAgents = Array.isArray(migrated.lastCascadeAgents) ? migrated.lastCascadeAgents : [];
    migrated.cascadeCount = Number.isFinite(migrated.cascadeCount) ? migrated.cascadeCount : 0;
    return migrated;
  }

  function safeParse(value) {
    if (!value) return null;
    try { return JSON.parse(value); } catch { return null; }
  }

  function money(value) {
    const n = Number(value) || 0;
    const sign = n < 0 ? '-' : '';
    const abs = Math.abs(n);
    if (abs >= 1000000) return `${sign}$${(abs / 1000000).toFixed(abs >= 10000000 ? 0 : 1)}M`;
    if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(abs >= 10000 ? 0 : 1)}K`;
    return `${sign}$${Math.round(abs)}`;
  }

  function titleCase(value) {
    return String(value).replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

  // ── Merge: unreliable-narrator helpers ─────────────────────────────

  /** Calibration after drift. Lower = reports diverge further from reality. */
  function effectiveCalibration(agent) {
    const cal = agent.calibration ?? 0.7;
    return clamp(cal * (1 - (agent.drift ?? 0) / 100 * DRIFT.CALIBRATION_PENALTY), 0, 1);
  }

  /** Reliability after drift. This is what actually determines success. */
  function effectiveReliability(agent) {
    return clamp(agent.reliability * (1 - (agent.drift ?? 0) / 100 * DRIFT.RELIABILITY_PENALTY), 30, 96);
  }

  /**
   * What the agent CLAIMS it achieved, versus what it did.
   * Miscalibration always skews optimistic — agents overclaim, they never
   * modestly underclaim. Returns a ratio >= 1.
   */
  function claimRatio(agent, rollFn) {
    const cal = effectiveCalibration(agent);
    return 1 + (1 - cal) * (0.15 + rollFn() * 0.95);
  }

  /** Trust moves only when a review reveals the truth. Asymmetric by design. */
  function updateTrustOnReview(agent, ratio) {
    if (ratio <= TRUST_RULES.ACCURATE_TOLERANCE) {
      agent.trust = clamp((agent.trust ?? 60) + TRUST_RULES.ACCURATE_GAIN, TRUST_RULES.FLOOR, TRUST_RULES.CEILING);
      return 'confirmed';
    }
    agent.trust = clamp((agent.trust ?? 60) - (ratio - 1) * TRUST_RULES.OVERCLAIM_LOSS_SCALE, TRUST_RULES.FLOOR, TRUST_RULES.CEILING);
    return 'overclaimed';
  }

  function trustLabel(trust) {
    const t = trust ?? 60;
    if (t < 30) return 'Skeptical';
    if (t < 55) return 'Cautious';
    if (t < 78) return 'Trusted';
    return 'Relied upon';
  }

  /** Mean trust across the roster — the TRUST stat in the topbar. */
  function rosterTrust() {
    if (!state.agents.length) return 0;
    return Math.round(state.agents.reduce((sum, a) => sum + (a.trust ?? 60), 0) / state.agents.length);
  }

  function meanDrift() {
    if (!state.agents.length) return 0;
    return Math.round(state.agents.reduce((sum, a) => sum + (a.drift ?? 0), 0) / state.agents.length);
  }

  function seededRandom(seedText) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seedText.length; i += 1) {
      h ^= seedText.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return function rng() {
      h += 0x6D2B79F5;
      let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
  }

  function toast(message, kind = '') {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = message;
    root.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  function playTone(frequency) {
    if (!state.settings.sound || !window.AudioContext) return;
    try {
      audioContext ||= new AudioContext();
      const ctx = audioContext;
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(.035, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .09);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + .1);
    } catch { /* Audio is optional. */ }
  }

  function syncBackgroundState() {
    document.body.classList.toggle('app-backgrounded', Boolean(document.hidden));
  }

  document.addEventListener('visibilitychange', syncBackgroundState);
  syncBackgroundState();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  render();
})();
</script>
